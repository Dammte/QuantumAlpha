services:
  - name: quantumalpha-api
    type: web
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: MARKET_DATA_PROVIDER
        value: yfinance
      # Reconstruction (2026-09), Fase 7: unset by default (no value given,
      # sync: false means Render never gets one from this file) - the
      # Gemini narrative layer stays fully inert until the propietario sets
      # this manually in the Render dashboard, same "wired, not activated"
      # note as the two cron jobs below. See GeminiNarrator's own docstring.
      - key: GEMINI_API_KEY
        sync: false

  # Reconstruction (2026-09), Fase 2, Job A: nightly precompute for the whole
  # universe's levels/triggers gate and every open position's exit-engine
  # read - see scripts/daily_close.py's own docstring for the full reasoning.
  # 22:00 UTC, Mon-Fri: safely after both the US close (20:00 UTC in EDT/
  # summer, 21:00 UTC in EST/winter - this schedule clears the later of the
  # two with margin) and the European close (STOXX Europe 600, mid-afternoon
  # UTC), with a couple of hours' buffer for the data provider to settle the
  # day's final bar before this job reads it.
  #
  # A Render Cron Job is a separate billed resource from the web service
  # above - creating this in the Render dashboard (or via `render blueprint
  # sync`) has a real cost; wiring it here in source control doesn't, so this
  # can be reviewed/adjusted before actually enabling it on Render.
  - name: quantumalpha-daily-close
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    schedule: "0 22 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.daily_close
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: yfinance

  # Reconstruction (2026-09), Fase 2, Job B: cheap intraday companion to Job
  # A - see scripts/intraday_refresh.py's own docstring. Every 30 minutes,
  # 08:00-21:00 UTC (covers the European session through the US close in
  # both DST states), Mon-Fri - only re-checks tickers that already have an
  # active entry trigger from last night's close, so this stays a small,
  # fast quote-only fetch even run this often. Same "billed resource, not
  # activated by wiring it here" note as quantumalpha-daily-close above.
  - name: quantumalpha-intraday-refresh
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    schedule: "*/30 8-21 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.intraday_refresh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: yfinance

  # Reconstruction (2026-09), Fase 10: monthly refresh of the point-in-time
  # dynamic universe (~400-1000 tickers across the real S&P 500/400 and
  # STOXX Europe 600 constituents) that `market_screener_service.get_universe_snapshot`
  # already auto-detects and prefers over the ~217-ticker curated
  # `market_universe.py` dict the moment a snapshot exists for a region (see
  # that method's own Bloque F-1 comment) - no code path change needed to
  # "activate" this, only data: this job is the *only* place that data gets
  # written. 1st of the month, 05:00 UTC (low-traffic, well outside both
  # daily-close/intraday-refresh windows above) - the script itself skips a
  # region that isn't due for refresh yet (30-day interval), so an
  # occasional missed/late run is harmless. Same "billed resource, not
  # activated by wiring it here" note as the two cron jobs above -
  # scripts/refresh_universe_membership.py can also be run by hand against
  # any DATABASE_URL (including a local dev DB) to populate/verify the table
  # without creating this Render resource at all.
  - name: quantumalpha-refresh-universe-membership
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    schedule: "0 5 1 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.refresh_universe_membership
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: yfinance
