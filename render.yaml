# Auditoria del Radar, bloque C.4: coste mensual estimado de los Render Cron
# Jobs declarados abajo, y cuáles recomiendo pagar. Cifras ORIENTATIVAS, no
# verificadas contra la página de precios vigente de Render en el momento en
# que se lea esto - Render factura los Cron Jobs por el tiempo de cómputo
# real de cada ejecución al ritmo del plan elegido (aquí "starter" en todos,
# igual que el propio servicio web), no una cuota fija mensual como un
# servicio siempre encendido. Verifica el precio/minuto vigente antes de
# decidir - esto es una guía de prioridad, no una factura.
#
#   quantumalpha-daily-close (22:00 UTC, L-V, ~22 corridas/mes):
#     Imprescindible - es el único escritor de `ticker_daily_states`, la
#     tabla que alimenta el Radar/Hoy. Sin él, ambos se quedan vacíos por
#     diseño (el fallback en vivo del bloque B es una red de seguridad, no
#     un sustituto). Duración estimada: 1-3 min/corrida (universo ya
#     cacheado en lotes, sin descarga repetida). RECOMENDADO, activar ya.
#
#   quantumalpha-refresh-universe-membership (05:00 UTC, día 1 de cada mes,
#   ~1 corrida/mes):
#     Barato por diseño (mensual, no diario) - amplía el universo curado de
#     ~217 tickers al universo dinámico real (S&P 500/400 + STOXX 600).
#     Duración estimada: varios minutos, una vez al mes. RECOMENDADO.
#
#   quantumalpha-setup-replay-study (domingo, después del cierre del
#   viernes, ~4 corridas/mes):
#     Sin él, `confidence` de todo setup se queda en "unvalidated" para
#     siempre y el Radar nunca muestra `measured_stats`/`ticker_history`
#     (bloque B7). Es el cron más caro por corrida individual (descarga ~10
#     años de histórico de todo el universo y reproduce 7 detectores en una
#     rejilla punto-en-el-tiempo - "varios minutos" según su propio
#     docstring, plausiblemente 10-20 min), pero corre solo 4 veces al mes.
#     RECOMENDADO si te importa que el Radar tenga evidencia medida detrás,
#     no solo geometría - que es justo lo que pediste.
#
#   quantumalpha-intraday-refresh (cada 30 min, 08:00-21:00 UTC, L-V, ~570
#   corridas/mes):
#     El más caro AGREGADO, por pura frecuencia, aunque cada corrida es
#     corta (solo re-consulta tickers con disparador ya activo). Bloque B5:
#     hoy NO tiene consumidor (nadie lee `ticker_intraday_states`) - pagarlo
#     ahora sería tirar el dinero. NO ACTIVAR todavía; revisar esta
#     recomendación cuando el bloque E5 (marcar en el Radar los disparos de
#     hoy en sesión) esté implementado y esta tabla tenga un lector real.
services:
  - name: quantumalpha-api
    type: web
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: MARKET_DATA_PROVIDER
        value: yfinance
      # Reconstruction (2026-09), Fase 7: unset by default (no value given,
      # sync: false means Render never gets one from this file) - the
      # Gemini narrative layer stays fully inert until the propietario sets
      # this manually in the Render dashboard, same "wired, not activated"
      # note as the two cron jobs below. See GeminiNarrator's own docstring.
      - key: GEMINI_API_KEY
        sync: false

  # Reconstruction (2026-09), Fase 2, Job A: nightly precompute for the whole
  # universe's levels/triggers gate and every open position's exit-engine
  # read - see scripts/daily_close.py's own docstring for the full reasoning.
  # 22:00 UTC, Mon-Fri: safely after both the US close (20:00 UTC in EDT/
  # summer, 21:00 UTC in EST/winter - this schedule clears the later of the
  # two with margin) and the European close (STOXX Europe 600, mid-afternoon
  # UTC), with a couple of hours' buffer for the data provider to settle the
  # day's final bar before this job reads it.
  #
  # A Render Cron Job is a separate billed resource from the web service
  # above - creating this in the Render dashboard (or via `render blueprint
  # sync`) has a real cost; wiring it here in source control doesn't, so this
  # can be reviewed/adjusted before actually enabling it on Render.
  # Auditoria del Radar, bloque B8: un Render Cron Job nunca pasa por el
  # ciclo de vida de FastAPI (`app.main`'s startup, donde
  # `run_migrations_on_startup` vive) - si este cron llega a correr antes de
  # que el servicio web haya reiniciado tras un deploy con migraciones
  # nuevas, se ejecutaria contra un esquema desactualizado y fallaria (o
  # peor, escribiria mal). `alembic upgrade head &&` en el propio
  # `startCommand` (no en `buildCommand`, cuyo momento de ejecucion exacto en
  # Render no está garantizado que preceda a cada disparo programado) hace
  # que cada ejecucion se asegure su propio esquema, sin depender del orden
  # de deploy entre servicios. Es una operacion barata e idempotente cuando
  # no hay nada pendiente.
  - name: quantumalpha-daily-close
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    schedule: "0 22 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m scripts.daily_close
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: yfinance

  # Reconstruction (2026-09), Fase 2, Job B: cheap intraday companion to Job
  # A - see scripts/intraday_refresh.py's own docstring. Every 30 minutes,
  # 08:00-21:00 UTC (covers the European session through the US close in
  # both DST states), Mon-Fri - only re-checks tickers that already have an
  # active entry trigger from last night's close, so this stays a small,
  # fast quote-only fetch even run this often. Same "billed resource, not
  # activated by wiring it here" note as quantumalpha-daily-close above.
  - name: quantumalpha-intraday-refresh
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    schedule: "*/30 8-21 * * 1-5"
    buildCommand: pip install -r requirements.txt
    # Bloque B8, mismo motivo que quantumalpha-daily-close arriba.
    startCommand: alembic upgrade head && python -m scripts.intraday_refresh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: yfinance

  # Reconstruction (2026-09), Fase 10: monthly refresh of the point-in-time
  # dynamic universe (~400-1000 tickers across the real S&P 500/400 and
  # STOXX Europe 600 constituents) that `market_screener_service.get_universe_snapshot`
  # already auto-detects and prefers over the ~217-ticker curated
  # `market_universe.py` dict the moment a snapshot exists for a region (see
  # that method's own Bloque F-1 comment) - no code path change needed to
  # "activate" this, only data: this job is the *only* place that data gets
  # written. 1st of the month, 05:00 UTC (low-traffic, well outside both
  # daily-close/intraday-refresh windows above) - the script itself skips a
  # region that isn't due for refresh yet (30-day interval), so an
  # occasional missed/late run is harmless. Same "billed resource, not
  # activated by wiring it here" note as the two cron jobs above -
  # scripts/refresh_universe_membership.py can also be run by hand against
  # any DATABASE_URL (including a local dev DB) to populate/verify the table
  # without creating this Render resource at all.
  - name: quantumalpha-refresh-universe-membership
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    schedule: "0 5 1 * *"
    buildCommand: pip install -r requirements.txt
    # Bloque B8, mismo motivo que quantumalpha-daily-close arriba.
    startCommand: alembic upgrade head && python -m scripts.refresh_universe_membership
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: yfinance

  # Auditoria del Radar, bloque B7/C.3: sin este cron, `setup_replay.
  # aggregate_setup_performance`/`aggregate_setup_history_by_ticker` nunca
  # se ejecutan contra el universo real, así que todo setup se queda en
  # `confidence="unvalidated"` para siempre y el Radar nunca muestra
  # `measured_stats`/`ticker_history` (§28.16-28.21) - la medición existe
  # desde hace fases, pero nadie la dispara en producción. Domingo 06:00
  # UTC (después del cierre del viernes, con margen de fin de semana antes
  # de que el lunes vuelva a operar) - semanal basta: la muestra histórica
  # que agrega no cambia de forma apreciable de un día para otro, y correrlo
  # más a menudo solo pagaría más sin medir nada distinto. Mismo "recurso
  # facturado aparte" que los tres crons anteriores.
  - name: quantumalpha-setup-replay-study
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    schedule: "0 6 * * 0"
    buildCommand: pip install -r requirements.txt
    # Bloque B8, mismo motivo que quantumalpha-daily-close arriba.
    startCommand: alembic upgrade head && python scripts/setup_replay_study.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: yfinance
