services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantumalpha
      POSTGRES_PASSWORD: quantumalpha
      POSTGRES_DB: quantumalpha
    ports:
      - "5432:5432"
    volumes:
      - quantumalpha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumalpha"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  quantumalpha_pgdata:
